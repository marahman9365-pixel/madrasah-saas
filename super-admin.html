<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>সুপার অ্যাডমিন প্যানেল | EduSaaS BD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand fw-bold">EduSaaS BD — সুপার অ্যাডমিন</span>
    <button id="logoutBtn" class="btn btn-outline-light btn-sm">লগআউট</button>
  </nav>

  <div class="container py-4">
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card border-0 shadow-sm bg-primary text-white">
          <div class="card-body">
            <h6>মোট নিবন্ধিত প্রতিষ্ঠান</h6>
            <h2 id="totalInstitutes" class="fw-bold mb-0">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card border-0 shadow-sm bg-success text-white">
          <div class="card-body">
            <h6>সক্রিয় (Active) প্রতিষ্ঠান</h6>
            <h2 id="activeInstitutes" class="fw-bold mb-0">0</h2>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card border-0 shadow-sm bg-warning text-dark">
          <div class="card-body">
            <h6>পেইড সাবস্ক্রাইবার (Standard/Pro)</h6>
            <h2 id="paidInstitutes" class="fw-bold mb-0">0</h2>
          </div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold">নিবন্ধিত মাদরাসা ও স্কুলসমূহ</h5>
        <input type="text" id="searchInput" class="form-control w-25" placeholder="নাম বা EIIN দিয়ে খুঁজুন...">
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>প্রতিষ্ঠানের নাম ও ঠিকানা</th>
              <th>ধরন / EIIN</th>
              <th>মোবাইল</th>
              <th>প্যাকেজ ও সীমা</th>
              <th>মেয়াদ ও স্ট্যাটাস</th>
              <th>অ্যাকশন</th>
            </tr>
          </thead>
          <tbody id="institutesTableBody">
            <tr><td colspan="6" class="text-center py-4">লোড হচ্ছে...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editPlanModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">সাবস্ক্রিপশন আপডেট করুন</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editInstId">
          <p id="editInstName" class="fw-bold text-primary"></p>
          
          <div class="mb-3">
            <label class="form-label">প্যাকেজ নির্বাচন করুন</label>
            <select id="editPlan" class="form-select">
              <option value="free_trial">Free Trial (সর্বোচ্চ ৫০ শিক্ষার্থী)</option>
              <option value="standard">Standard (সর্বোচ্চ ৫০০ শিক্ষার্থী)</option>
              <option value="pro">Pro (আনলিমিটেড শিক্ষার্থী)</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">সর্বোচ্চ শিক্ষার্থী সংখ্যা</label>
            <input type="number" id="editMaxStudents" class="form-control" value="500">
          </div>
          <div class="mb-3">
            <label class="form-label">মেয়াদ শেষ হওয়ার তারিখ</label>
            <input type="date" id="editExpiryDate" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">অ্যাকাউন্ট স্ট্যাটাস</label>
            <select id="editStatus" class="form-select">
              <option value="active">Active (চালু)</option>
              <option value="expired">Expired (মেয়াদোত্তীর্ণ)</option>
              <option value="suspended">Suspended (স্থগিত)</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">বাতিল</button>
          <button type="button" id="savePlanBtn" class="btn btn-success">সংরক্ষণ করুন</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/super-admin.js"></script>
</body>
</html>
