<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লগইন | EduSaaS BD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h4 class="text-center mb-4 text-primary fw-bold">সফটওয়্যার লগইন</h4>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">ইমেইল</label>
                <input type="email" id="loginEmail" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">পাসওয়ার্ড</label>
                <input type="password" id="loginPassword" class="form-control" required>
              </div>
              <button type="submit" id="loginBtn" class="btn btn-primary w-100 py-2 fw-bold">প্রবেশ করুন</button>
            </form>
            <div id="loginMsg" class="mt-3 text-center text-danger small"></div>
            <div class="text-center mt-3">
              <a href="register.html" class="text-decoration-none">নতুন প্রতিষ্ঠান নিবন্ধন করুন</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
