<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>নতুন প্রতিষ্ঠান নিবন্ধন | EduSaaS BD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h3 class="text-center mb-3 text-success fw-bold">প্রতিষ্ঠান নিবন্ধন করুন</h3>
            <p class="text-center text-muted small">৩০ দিনের ফ্রি ট্রায়াল (সর্বোচ্চ ৫০ জন শিক্ষার্থী)</p>
            
            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label">প্রতিষ্ঠানের ধরন</label>
                <select id="instType" class="form-select" required>
                  <option value="madrasah">মাদরাসা (ইবতেদায়ী / দাখিল / আলিম)</option>
                  <option value="school">স্কুল / কিন্ডারগার্টেন</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">প্রতিষ্ঠানের নাম</label>
                <input type="text" id="instName" class="form-control" placeholder="যেমন: আল-আমিন জামেয়া ইসলামিয়া আলিম মাদরাসা" required>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">EIIN / কোড (যদি থাকে)</label>
                  <input type="text" id="eiin" class="form-control" placeholder="যেমন: 130255">
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">মোবাইল নম্বর</label>
                  <input type="tel" id="phone" class="form-control" placeholder="017XXXXXXXX" required>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label">ঠিকানা (উপজেলা, জেলা)</label>
                <input type="text" id="address" class="form-control" placeholder="ফেঞ্চুগঞ্জ, সিলেট" required>
              </div>
              <hr>
              <div class="mb-3">
                <label class="form-label">প্রতিষ্ঠান প্রধান / অ্যাডমিনের নাম</label>
                <input type="text" id="adminName" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">ইমেইল (লগইনের জন্য)</label>
                <input type="email" id="email" class="form-control" required>
              </div>
              <div class="mb-3">
                <label class="form-label">পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)</label>
                <input type="password" id="password" class="form-control" minlength="6" required>
              </div>
              <button type="submit" id="submitBtn" class="btn btn-success w-100 py-2 fw-bold">অ্যাকাউন্ট তৈরি করুন</button>
            </form>
            <div id="msg" class="mt-3 text-center"></div>
            <div class="text-center mt-3">
              <a href="login.html" class="text-decoration-none">ইতিমধ্যে অ্যাকাউন্ট আছে? লগইন করুন</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
